# Takes https://pages.flisk.si/@odykyi/pages-ci-demo/ down, with no secret.
name: Remove report
on: workflow_dispatch
permissions:
  id-token: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: flisk-sh/pages@v1
        with:
          command: remove
          slug: pages-ci-demo
